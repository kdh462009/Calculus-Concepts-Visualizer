<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calc BC Visualizers</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div id="openingSplash" class="opening-splash" aria-hidden="true">
    <div class="opening-glow"></div>
    <div class="opening-streak"></div>
    <div class="opening-content">
      <div class="opening-symbols"><span>∫</span><span>∑</span><span>f′</span><span>rθ</span></div>
      <h1 class="opening-title">CALC BC</h1>
      <p class="opening-sub">Interactive Visualizers</p>
    </div>
  </div>

  <div class="app-shell launcher-shell opening-pending">
    <header class="header launcher-header">
      <div class="title-row">
        <h1>CALC BC</h1>
        <span>interactive visualizers</span>
      </div>
      <p class="launcher-tagline">Expand a unit, then open a visualizer.</p>
    </header>

    <main class="launcher-panel" aria-label="Available visualizers">
      <div class="viz-tree-wrap glass">
        <ul id="vizTree" class="viz-tree"></ul>
      </div>
    </main>

    <footer class="credit-row">
      <span>Made by Agniva, Donghui, Manya, and Adam</span>
    </footer>
  </div>

  <script src="../core/nav.js"></script>
  <script src="./app.js"></script>
</body>
</html>
