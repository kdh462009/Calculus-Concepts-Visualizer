<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parametric Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>(x,y) PARAMETRIC</h1>
          <span>BC Unit 9 — motion, derivatives, arc length</span>
        </div>
        <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">⌂ Home</button>
      </div>
      <div id="ruleLine" class="error-bound">dy/dx = y′(t) / x′(t)</div>
      <div class="latex-row">
        <div id="formulaLine" style="color:#f5c842;font-weight:700;">Curve: --</div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">x(t)</label>
        <input id="xExprInput" list="functionHints" value="cos(t)" autocomplete="off">

        <label class="section-label">y(t)</label>
        <input id="yExprInput" list="functionHints" value="sin(t)" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">PARAMETER RANGE [tmin, tmax]</label>
        <div class="row">
          <input id="tminInput" type="number" value="0" step="0.25">
          <input id="tmaxInput" type="number" value="6.283" step="0.25">
        </div>

        <label class="section-label">ANIMATION DURATION <span id="durationValue">9000 ms</span></label>
        <input id="durationInput" type="range" min="3500" max="16000" value="9000" step="250">

        <button id="animateBtn" class="btn btn-primary">▶ ANIMATE</button>
        <button id="pauseBtn" class="btn btn-secondary">⏸ PAUSE</button>
        <button id="resetBtn" class="btn btn-ghost">↺ RESET VIEW</button>
        <button id="legendToggleBtn" class="btn btn-ghost" type="button">Hide legend</button>

        <div id="status" class="status">ready.</div>
        <div id="phaseLine" class="term-counter"></div>
        <div id="scaleLine" class="status">Scale: --</div>
        <div id="legendLine" class="status">Legend: --</div>
        <div id="metricLine" class="status">Arc length: --</div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="paramCanvas"></canvas>
      </section>
    </main>
    <footer class="credit-row">
      <span>Made by </span>
      <a href="https://knivier.com" target="_blank" rel="noopener noreferrer">knivier</a>
    </footer>
  </div>

  <script src="../core/nav.js"></script>
  <script src="./app.js"></script>
</body>
</html>
