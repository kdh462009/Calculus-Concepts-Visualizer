name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-webapp.txt

      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: CalcBCVisualizers-windows
          path: |
            dist/CalcBCVisualizers-windows.zip
            dist/CalcBCVisualizers/
