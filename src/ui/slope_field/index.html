<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slope Field Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>Slope fields</h1>
          <span>BC Unit 7 — y′ = f(x, y) and numerical IVPs</span>
        </div>
        <div class="header-actions">
          <span class="beta-badge" data-tip="Production testing is live" tabindex="0">Beta</span>
          <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">Home</button>
        </div>
      </div>
      <div id="ruleLine" class="error-bound">y<sub>n+1</sub> = y<sub>n</sub> + h f(x<sub>n</sub>, y<sub>n</sub>)</div>
      <div class="latex-row">
        <div id="exprLine" style="color:#f5c842;font-weight:700;">y′ = —</div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">y′ = f(x, y)</label>
        <input id="exprInput" class="math-expr" list="functionHints" value="x - y" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">INITIAL CONDITION (x<sub>0</sub>, y<sub>0</sub>)</label>
        <div class="row">
          <input id="x0Input" type="number" value="0" step="0.25">
          <input id="y0Input" type="number" value="1" step="0.25">
        </div>
        <p class="formal-line">The white dot is your IVP start: y(x<sub>0</sub>) = y<sub>0</sub>. Click the plot or drag the dot — solution curves update live.</p>

        <label class="section-label">STEP SIZE h <span id="hValue">0.25</span></label>
        <input id="hInput" type="range" min="5" max="80" value="25" step="1">

        <label class="section-label">FIELD DENSITY <span id="gridValue">16</span></label>
        <input id="gridInput" type="range" min="8" max="28" value="16" step="1">

        <label class="section-label">METHODS</label>
        <label class="section-label">
          <input id="showEuler" type="checkbox" checked>
          EULER
        </label>
        <label class="section-label">
          <input id="showMidpoint" type="checkbox" checked>
          MIDPOINT
        </label>
        <label class="section-label">
          <input id="showRk4" type="checkbox" checked>
          RK4
        </label>
        <label class="section-label">
          <input id="showField" type="checkbox" checked>
          SLOPE FIELD
        </label>
        <label class="section-label">
          <input id="bothWays" type="checkbox" checked>
          INTEGRATE BOTH DIRECTIONS
        </label>

        <label class="section-label">ANIMATION SPEED <span id="speedValue">90 ms</span></label>
        <input id="speedInput" type="range" min="20" max="240" value="90" step="10">

        <div class="btn-row">
          <button id="animateBtn" class="btn btn-primary">Animate</button>
          <button id="pauseBtn" class="btn btn-secondary">Pause</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
        </div>

        <div id="status" class="status">ready.</div>
        <div id="termCounter" class="term-counter"></div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="plotCanvas"></canvas>
        <div id="plotLegend" class="plot-legend plot-key">
          <div class="plot-key-title">Solution</div>
          <div class="plot-legend-item"><span class="plot-legend-swatch" style="background:#f5c842"></span> Euler</div>
          <div class="plot-legend-item"><span class="plot-legend-swatch" style="background:#f06090"></span> Midpoint</div>
          <div class="plot-legend-item"><span class="plot-legend-swatch" style="background:#2ee8bb"></span> RK4</div>
        </div>
      </section>
    </main>
  </div>

  <script src="../core/nav.js"></script>
  <script src="../core/math-input.js"></script>
  <script src="../core/scale-bar.js"></script>
  <script src="../core/graph.js"></script>
  <script src="./app.js"></script>
</body>
</html>
