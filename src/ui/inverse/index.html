<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inverse Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>Inverse</h1>
          <span>function + inverse + derivative relation</span>
        </div>
        <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">Home</button>
      </div>
      <div id="ruleLine" class="error-bound">(f^{-1})'(x) = 1 / f'(f^{-1}(x))</div>
      <div class="latex-row">
        <div id="exprLine" style="color:#f5c842;font-weight:700;">f'(x): --</div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">FUNCTION f(x)</label>
        <input id="exprInput" class="math-expr" list="functionHints" value="x^3 + x" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">X RANGE</label>
        <div class="row">
          <input id="xminInput" type="number" value="-3" step="0.5">
          <input id="xmaxInput" type="number" value="3" step="0.5">
        </div>

        <div class="btn-row btn-row-2">
          <button id="stageBtn" class="btn btn-primary">Plot Inverse</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
        </div>

        <div id="status" class="status">ready.</div>
        <div id="phaseLine" class="term-counter"></div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="plotCanvas"></canvas>
        <div id="plotLegend" class="plot-legend" hidden></div>
      </section>
    </main>
  </div>

  <script src="../core/nav.js"></script>
  <script src="../core/math-input.js"></script>
  <script src="../core/scale-bar.js"></script>
  <script src="../core/graph.js"></script>
  <script src="./app.js"></script>
</body>
</html>
