<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arc Length Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>Arc length</h1>
          <span>polygonal chords approaching the integral</span>
        </div>
        <div class="header-actions">
          <span class="beta-badge" data-tip="Production testing is live" tabindex="0">Beta</span>
          <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">Home</button>
        </div>
      </div>
      <div id="formulaLine" class="error-bound">Polygonal chords L<sub>n</sub> approaching the arc length integral.</div>
      <div class="latex-row">
        <img id="latexImage" alt="Arc length formulas">
      </div>
      <div class="latex-row">
        <img id="readoutImage" alt="Arc length estimate" hidden>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">FUNCTION f(x)</label>
        <input id="exprInput" class="math-expr" list="functionHints" value="x^2" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">INTERVAL [a, b]</label>
        <div class="row">
          <input id="aInput" type="number" value="0" step="0.25">
          <input id="bInput" type="number" value="2" step="0.25">
        </div>

        <label class="section-label">START SEGMENTS n <span id="nValue">1</span></label>
        <input id="nInput" type="range" min="1" max="80" value="1">

        <label class="section-label">ANIMATE UP TO n <span id="nMaxValue">64</span></label>
        <input id="nMaxInput" type="range" min="2" max="320" value="64">

        <label class="section-label">ANIMATION SPEED <span id="speedValue">600 ms</span></label>
        <input id="speedInput" type="range" min="60" max="1200" value="600">

        <label class="section-label">PLOT X RANGE</label>
        <div class="row">
          <input id="xminInput" type="number" value="-0.5" step="0.5">
          <input id="xmaxInput" type="number" value="2.5" step="0.5">
        </div>

        <div class="btn-row">
          <button id="animateBtn" class="btn btn-primary">Animate</button>
          <button id="pauseBtn" class="btn btn-secondary">Pause</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
        </div>

        <div id="status" class="status">ready.</div>
        <div id="termCounter" class="term-counter"></div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="plotCanvas"></canvas>
      </section>
    </main>
  </div>

  <script src="../core/nav.js"></script>
  <script src="../core/latex.js"></script>
  <script src="../core/math-input.js"></script>
  <script src="../core/scale-bar.js"></script>
  <script src="../core/axis-labels.js"></script>
  <script src="../core/graph.js"></script>
  <script src="../core/function-preview.js"></script>
  <script src="./app.js"></script>
</body>
</html>
