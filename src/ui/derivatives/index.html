<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Derivative Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>Derivatives</h1>
          <span>slope animation + first and second derivative</span>
        </div>
        <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">Home</button>
      </div>
      <div id="analysis" class="status">Pick a function, then press Animate.</div>
      <div id="concavityStatus" class="error-bound">Concavity insight appears when second derivative is enabled.</div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">FUNCTION</label>
        <input id="exprInput" class="math-expr" list="functionHints" value="x^3 - 3x" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">ANIMATION INTERVAL [a, b]</label>
        <div class="row">
          <input id="aInput" type="number" value="-2" step="0.25">
          <input id="bInput" type="number" value="2" step="0.25">
        </div>

        <label class="section-label">FRAMES <span id="stepsValue">70</span></label>
        <input id="stepsInput" type="range" min="20" max="200" value="70">

        <label class="section-label">ANIMATION SPEED <span id="speedValue">70 ms</span></label>
        <input id="speedInput" type="range" min="20" max="300" value="70">

        <label class="section-label">PLOT X RANGE</label>
        <div class="row">
          <input id="xminInput" type="number" value="-4" step="0.5">
          <input id="xmaxInput" type="number" value="4" step="0.5">
        </div>

        <label class="section-label">
          <input id="showSecondInput" type="checkbox" checked>
          SHOW SECOND DERIVATIVE + CONCAVITY
        </label>

        <div class="btn-row">
          <button id="animateBtn" class="btn btn-primary">Animate</button>
          <button id="pauseBtn" class="btn btn-secondary">Pause</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
        </div>

        <div id="status" class="status">ready.</div>
        <div id="termCounter" class="term-counter"></div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="plotCanvas"></canvas>
      </section>
    </main>
  </div>

  <script src="../core/nav.js"></script>
  <script src="../core/math-input.js"></script>
  <script src="../core/scale-bar.js"></script>
  <script src="../core/graph.js"></script>
  <script src="../core/function-preview.js"></script>
  <script src="./app.js"></script>
</body>
</html>
