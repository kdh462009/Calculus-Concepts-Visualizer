<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limit Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>Limits</h1>
          <span>how close f(x) stays to L</span>
        </div>
        <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">Home</button>
      </div>
      <div id="definitionLine" class="error-bound">If x is close enough to a, then f(x) stays close to L.</div>
      <div class="latex-row">
        <img id="latexImage" alt="Epsilon-delta definition">
      </div>
      <div class="latex-row">
        <img id="readoutImage" alt="Limit readout" hidden>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">FUNCTION f(x)</label>
        <input id="exprInput" class="math-expr" list="functionHints" value="(x^2-1)/(x-1)" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">APPROACH POINT a <span class="label-hint">(x-value we approach)</span></label>
        <input id="aInput" type="number" value="1" step="0.25">

        <label class="section-label">LIMIT VALUE L <span class="label-hint">(target y-value, optional)</span></label>
        <input id="limitInput" type="text" value="">

        <label class="section-label">Y-DISTANCE FROM L  ε <span class="label-hint">start / end</span></label>
        <div class="row">
          <input id="epsStartInput" type="number" value="1.2" step="0.05" min="0.01">
          <input id="epsEndInput" type="number" value="0.1" step="0.01" min="0.001">
        </div>

        <label class="section-label">X WINDOW</label>
        <div class="row">
          <input id="xminInput" type="number" value="-2" step="0.5">
          <input id="xmaxInput" type="number" value="4" step="0.5">
        </div>

        <label class="section-label">ANIMATION DURATION <span id="durationValue">7000 ms</span></label>
        <input id="durationInput" type="range" min="2500" max="16000" value="7000" step="250">

        <button id="computeBtn" class="btn btn-primary">Compute</button>
        <div class="btn-row">
          <button id="animateBtn" class="btn btn-secondary">Animate</button>
          <button id="pauseBtn" class="btn btn-ghost">Pause</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
        </div>

        <div id="status" class="status">ready.</div>
        <div id="readout" class="term-counter"></div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="limitCanvas"></canvas>
        <div id="plotKey" class="plot-legend plot-key">
          <div class="plot-key-title">Key</div>
          <div class="plot-legend-item"><span class="plot-legend-swatch" style="background:#7df0cd"></span><span><b>a</b> approach x-value</span></div>
          <div class="plot-legend-item"><span class="plot-legend-swatch" style="background:#f5c842"></span><span><b>L</b> limit (target y)</span></div>
          <div class="plot-legend-item"><span class="plot-legend-swatch" style="background:#c9a227"></span><span><b>ε</b> allowed y-distance from L</span></div>
          <div class="plot-legend-item"><span class="plot-legend-swatch" style="background:#9e8dff"></span><span><b>δ</b> allowed x-distance from a</span></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../core/nav.js"></script>
  <script src="../core/latex.js"></script>
  <script src="../core/math-input.js"></script>
  <script src="../core/scale-bar.js"></script>
  <script src="./app.js"></script>
</body>
</html>
