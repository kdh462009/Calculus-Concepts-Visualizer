<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parametric Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>Parametric</h1>
          <span>BC Unit 9 · motion, derivatives, arc length</span>
        </div>
        <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">Home</button>
      </div>
      <div id="ruleLine" class="error-bound">Parametric motion, tangent slope, speed, and arc length.</div>
      <div class="latex-row">
        <img id="latexImage" alt="Parametric formulas">
      </div>
      <div class="latex-row">
        <img id="readoutImage" alt="Arc length" hidden>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">x(t)</label>
        <input id="xExprInput" class="math-expr" list="functionHints" value="cos(t)" autocomplete="off">

        <label class="section-label">y(t)</label>
        <input id="yExprInput" class="math-expr" list="functionHints" value="sin(t)" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">PARAMETER RANGE [tmin, tmax]</label>
        <div class="row">
          <input id="tminInput" type="number" value="0" step="0.25">
          <input id="tmaxInput" type="number" value="6.283" step="0.25">
        </div>

        <label class="section-label">ANIMATION DURATION <span id="durationValue">9000 ms</span></label>
        <input id="durationInput" type="range" min="3500" max="16000" value="9000" step="250">

        <div class="btn-row">
          <button id="animateBtn" class="btn btn-primary">Animate</button>
          <button id="pauseBtn" class="btn btn-secondary">Pause</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
        </div>

        <div id="status" class="status">ready.</div>
        <div id="phaseLine" class="term-counter"></div>
        <div id="metricLine" class="status" hidden>Arc length: --</div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="paramCanvas"></canvas>
        <div id="plotLegend" class="plot-legend" hidden></div>
      </section>
    </main>
  </div>

  <script src="../core/nav.js"></script>
  <script src="../core/latex.js"></script>
  <script src="../core/math-input.js"></script>
  <script src="../core/view-snap.js"></script>
  <script src="../core/scale-bar.js"></script>
  <script src="../core/axis-labels.js"></script>
  <script src="./app.js"></script>
</body>
</html>
