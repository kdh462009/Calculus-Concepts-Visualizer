<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volume Rotation Visualizer</title>
  <link rel="stylesheet" href="../core/styles.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../core/transitions.css">
  <script src="../core/transitions.js"></script>
</head>
<body class="volume-page">
  <div class="app-shell">
    <header class="header">
      <div class="header-top">
        <div class="title-row">
          <h1>Volume of revolution</h1>
          <span>solid of revolution</span>
        </div>
        <button id="homeBtn" class="btn-home" type="button" title="Back to visualizers">Home</button>
      </div>
      <div class="volume-formula-strip">
        <div class="latex-row">
          <img id="latexImage" alt="Area and volume formulas">
        </div>
        <div class="volume-formula-divider" aria-hidden="true"></div>
        <div class="latex-row">
          <img id="readoutImage" alt="Area and volume values" hidden>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel glass">
        <label class="section-label">FUNCTION f(x)</label>
        <input id="exprInput" class="math-expr" list="functionHints" value="x^2" autocomplete="off">
        <datalist id="functionHints"></datalist>

        <label class="section-label">PRESETS</label>
        <div id="presets" class="preset-grid"></div>

        <label class="section-label">ROTATION AXIS</label>
        <select id="axisInput"></select>

        <label class="section-label">BOUNDS [a, b]</label>
        <div class="row">
          <input id="aInput" type="number" value="0" step="0.25">
          <input id="bInput" type="number" value="2" step="0.25">
        </div>

        <label class="section-label">X WINDOW</label>
        <div class="row">
          <input id="xminInput" type="number" value="-1" step="0.5">
          <input id="xmaxInput" type="number" value="3" step="0.5">
        </div>

        <label class="section-label">ROTATION SPEED <span id="speedValue">7000 ms</span></label>
        <input id="speedInput" type="range" min="3000" max="14000" value="7000" step="250">

        <div class="btn-row">
          <button id="animateBtn" class="btn btn-primary">Animate</button>
          <button id="pauseBtn" class="btn btn-ghost">Pause</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
        </div>

        <div id="status" class="status">ready.</div>
        <div id="volumeReadout" class="term-counter" hidden>Volume: --</div>
        <div id="areaReadout" class="term-counter" hidden>Area: --</div>
      </aside>

      <section class="plot-wrap glass">
        <canvas id="volumeCanvas"></canvas>
        <div class="volume-hud">
          <span id="axisChip" class="volume-chip">About the x-axis</span>
        </div>
      </section>
    </main>
  </div>

  <script src="../core/nav.js"></script>
  <script src="../core/latex.js"></script>
  <script src="../core/math-input.js"></script>
  <script src="../core/view-snap.js"></script>
  <script src="../core/scale-bar.js"></script>
  <script src="./app.js"></script>
</body>
</html>
